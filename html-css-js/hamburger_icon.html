<!DOCTYPE html>
<html>
    <head>
        <style>
            body {
                padding: 0;
                border: 0;
                margin: 0;
            }
            p {
                padding: 0;
                border: 0;
                margin: 0;
            }
            button {
                display: block;
            }


            .icon1::before {
                content: "⇛";
                font-size: 3em;
                font-weight: bold;
            }

            .icon2::before {
                content: "☰";
                font-size: 3em;
                font-weight: bold;
            }

            .icon3::before {
                content: "≡";
                font-size: 3em;
                font-weight: bold;
            }

            .hamburger {
                display: flex;
                flex-direction: column;
                row-gap: 5px;
                padding: 5px;
            }

            .hamburger > p {
                height: 5px;
                width: 30px;
                background-color: black;
                border-radius: 3px;
            }

            .menu-btn {
              background: none;
              border: none;
              cursor: pointer;
              padding: 8px;
              color: #000;
            }

            .menu-btn svg {
              display: block;
              fill: currentColor;
            }

        </style>
    </head>
    <body>
        <p class="icon1"></p>
        <p class="icon2"></p>
        <p class="icon3"></p>


        <div class="hamburger">
            <p></p>
            <p></p>
            <p></p>
        </div>

        <button class="menu-btn" aria-label="Open menu">
          <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="3" y="6" width="18" height="2" rx="1"></rect>
            <rect x="3" y="11" width="18" height="2" rx="1"></rect>
            <rect x="3" y="16" width="18" height="2" rx="1"></rect>
          </svg>
        </button>
    </body>

</html>
